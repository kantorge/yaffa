services:
  yaffa.test:
    build:
      context: ./vendor/laravel/sail/runtimes/8.4
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP}'
    image: sail-8.4/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-80}:80'
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
    environment:
      WWWUSER: '${WWWUSER}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
      VITE_PORT: '${VITE_PORT:-5173}'
    volumes:
      - '.:/var/www/html'
    networks:
      - sail
    depends_on:
      - mysql
      - mailhog
      - selenium
  mysql:
    image: 'mysql:8.0'
    # Local dev/test only, never production: skip the per-commit fsync/binlog-sync durability
    # guarantees MySQL defaults to, since this container's data is disposable (migrate+seed
    # recreates it). Cuts write-heavy migrations/seeding/tests noticeably; on a host crash the
    # worst case is losing the last few seconds of writes to this container's own volume, which
    # is an acceptable trade here only because nothing here is real data.
    command: --innodb-flush-log-at-trx-commit=0 --sync-binlog=0
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - 'sail-mysql:/var/lib/mysql'
      - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
    networks:
      - sail
    stop_grace_period: 1m
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-uroot', '-p${DB_PASSWORD}']
      start_period: 30s
      retries: 3
      timeout: 5s
  mailhog:
    image: 'mailhog/mailhog:latest'
    ports:
      - '${FORWARD_MAILHOG_PORT:-1025}:1025'
      - '${FORWARD_MAILHOG_DASHBOARD_PORT:-8025}:8025'
    networks:
      - sail
  selenium:
    image: selenium/standalone-chrome:140.0
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - '/dev/shm:/dev/shm'
    ports:
      - '4444:4444'
    networks:
      - sail
networks:
  sail:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.120.19.0/24
volumes:
  sail-mysql:
    driver: local
