name: E2E Tests (Pest Browser)

on:
  pull_request:
    branches-ignore:
      - main
    paths:
      - 'app/**'
      - 'tests/PEST/**'
      - 'tests/Pest.php'
      - 'tests/TestCase.php'
      - 'database/**'
      - 'resources/**'
      - 'routes/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'phpunit.xml'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: Run Pest Browser Tests

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: default
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: secretroot
        ports:
          - 3306/tcp
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, mysql, sockets
          coverage: none

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get composer cache directory
        run: echo "COMPOSER_CACHE_DIR=$(composer config cache-files-dir)" >> $GITHUB_ENV

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts

      - name: Cache NPM Dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install NPM Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Assets
        run: npm run build

      - name: Prepare Laravel Application
        run: ln -f -s .env.ci .env

      - name: Clear Config
        run: php artisan config:clear

      # Pest serves the app in-process: no artisan serve, no chromedriver.
      # The suite migrates and seeds the testing database itself (RefreshDatabase + $seed).
      - name: Run Pest Browser Tests
        run: vendor/bin/pest --colors=never --testsuite=Browser
        env:
          DB_PORT: ${{ job.services.mysql.ports['3306'] }}

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-screenshots
          path: tests/Browser/Screenshots
