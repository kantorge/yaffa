name: Deploy to Private Server

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref_name:
        description: 'Reference name to simulate github.ref_name'
        required: true
        default: 'test'
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - Private
          - Sandbox
        default: 'Private'

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ${{ github.event_name == 'release' && fromJSON('["Private", "Sandbox"]') || fromJSON(format('["{0}"]', github.event.inputs.environment)) }}
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.ref_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "$SSH_KEY" > ~/.ssh/private_key
          chmod 600 ~/.ssh/private_key
          cat >>~/.ssh/config <<END
            Host host_name
              HostName $SSH_HOST
              User $SSH_USER
              IdentityFile ~/.ssh/private_key
              StrictHostKeyChecking no
          END

      - name: Prevent downgrading an automated release deploy
        if: github.event_name == 'release'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          TARGET_TAG: ${{ github.event.release.tag_name }}
        run: |
          TARGET_VERSION="${TARGET_TAG#v}"
          DEPLOYED_VERSION=$(ssh host_name "cat $DEPLOY_PATH/current/composer.json" 2>/dev/null | grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' | grep -o '[0-9][^"]*')
          if [ -z "$DEPLOYED_VERSION" ]; then
            echo "No currently deployed version found (first deploy?) - skipping check."
            exit 0
          fi
          HIGHER=$(printf '%s\n%s\n' "$DEPLOYED_VERSION" "$TARGET_VERSION" | sort -V | tail -n1)
          if [ "$HIGHER" != "$TARGET_VERSION" ] && [ "$DEPLOYED_VERSION" != "$TARGET_VERSION" ]; then
            echo "::error::Refusing to deploy $TARGET_VERSION: currently deployed version is $DEPLOYED_VERSION (this would downgrade). Use workflow_dispatch to deploy intentionally."
            exit 1
          fi
          echo "OK: deploying $TARGET_VERSION (currently deployed: $DEPLOYED_VERSION)"

      - name: Deploy Yaffa to ${{ matrix.environment }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_REF: ${{ github.event.release.tag_name || github.event.inputs.ref_name }}
        uses: deployphp/action@master
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          dep: yaffa
